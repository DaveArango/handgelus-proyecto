spring.application.name=handgelus-back
server.port=8080

# --- Datasource Oracle ---
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASSWORD:sasa}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# 'update': crea/actualiza automaticamente las tablas a partir de las @Entity
# al arrancar. Para produccion se recomienda 'validate' + migraciones
# versionadas (Flyway/Liquibase), pero para el arranque del proyecto
# academico esto satisface "que se cree automaticamente la BD".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Desactiva el usuario in-memory por defecto de Spring Security
# (se usa autenticacion propia basada en Usuario + JWT)
spring.security.user.name=disabled

# --- JWT ---
# Clave para firmar los tokens (SWR-02: autenticacion por credenciales unicas).
# En produccion se debe inyectar por variable de entorno, nunca dejarla en el repo.
security.jwt.secret=${JWT_SECRET:c2VjcmV0LWhhbmRnZWx1c2FwcC1jYW1iaWFyLWVuLXByb2R1Y2Npb24tMjAyNg==}
security.jwt.expiration-ms=43200000

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Administrador inicial (creado automaticamente al primer arranque) ---
app.admin-inicial.correo=${ADMIN_CORREO:admin@handgelus.com}
app.admin-inicial.contrasena=${ADMIN_CONTRASENA:Handgelus2026*}

# --- CORS (origenes permitidos para el front) ---
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}